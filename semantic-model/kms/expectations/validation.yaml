# What each example is for.
#
# Folder names group and select; they do not decide anything. A file under bad/
# that asserts nothing is an unfinished test, not a passing one -- what an
# example means comes from `expect` and `asserts`.
#
# `include` composes an example from subobjects. "A cutter running while its
# filter is off" needs a filter, a cartridge and a workpiece to be a
# well-formed entity at all, and repeating those in every case makes the
# difference between two cases hard to see and easy to get wrong. Includes are
# merged first, so the example wins where both describe the same entity.

examples:
  # --- good -----------------------------------------------------------------
  - path: good/cutter-processing-with-filter-on.jsonld
    description: >-
      The healthy baseline: a cutter PROCESSING while the filter it drives is
      ON. Nothing should fire, so conformance is full rather than focused.
    include:
      - subobjects/workpiece-steel.jsonld
      - subobjects/cartridge-fresh.jsonld
      - subobjects/filter-on.jsonld
    expect: valid
    conformance: full

  - path: good/workpiece-at-the-limits.jsonld
    description: >-
      Height 5.0, width 100.0, length 200.0 -- every bound at its inclusive
      maximum. Guards an off-by-one turning maxInclusive into maxExclusive.
    expect: valid
    conformance: full

  # --- bad ------------------------------------------------------------------
  - path: bad/cutter-processing-with-filter-off.jsonld
    description: >-
      The same scene with the filter OFF. This is the case StateOnCutterShape
      exists for, and it is the only difference from the good example above.
    include:
      - subobjects/workpiece-steel.jsonld
      - subobjects/cartridge-fresh.jsonld
      - subobjects/filter-off.jsonld
    expect: invalid
    asserts:
      - constraint: iffBaseShacl:StateOnCutterShape/SPARQLConstraintComponent
        resource: urn:plasmacutter:1

  - path: bad/workpiece-too-high.jsonld
    description: A height of 50 against a maximum of 5.0.
    expect: invalid
    asserts:
      - constraint: iffBaseShacl:WorkpieceShape/hasHeight/MaxInclusiveConstraintComponent
        resource: urn:workpiece:1

  - path: bad/filter-without-cartridge.jsonld
    description: FilterShape requires exactly one cartridge.
    expect: invalid
    asserts:
      - constraint: iffBaseShacl:FilterShape/hasCartridge/MinCountConstraintComponent
        resource: urn:filter:9

  - path: bad/cartridge-shared-by-two-filters.jsonld
    description: >-
      Two filters pointing at one cartridge. This is the case the inverse-path
      exclusivity rule was written for, and until this example existed nothing
      proved it could fire -- `semforge test --coverage` reported it
      no-firing-example.
    include:
      - subobjects/workpiece-steel.jsonld
      - subobjects/cartridge-fresh.jsonld
    expect: invalid
    asserts:
      - constraint: iffBaseShacl:CartridgeShape/hasCartridge/MaxCountConstraintComponent
        resource: urn:cartridge:1
